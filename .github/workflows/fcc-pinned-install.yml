name: FCC pinned cloud installation check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fcc-pinned-install.yml'

permissions:
  contents: read

concurrency:
  group: fcc-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    name: Install pinned FCC in temporary runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_NO_PROGRESS: "1"
      UV_PYTHON_PREFERENCE: only-managed
      UV_MALWARE_CHECK: "1"
      UV_PREVIEW_FEATURES: malware-check
    steps:
      - name: Checkout lab without retained authentication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: lab
      - name: Checkout exact reviewed FCC source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Alishahryar1/free-claude-code
          ref: 42bf8439cba25eae02a4dcb909a72227a46510a6
          persist-credentials: false
          path: upstream-fcc
      - name: Verify source identity and project metadata
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-fcc
          test "$(git rev-parse HEAD)" = "42bf8439cba25eae02a4dcb909a72227a46510a6"
          python3 - <<'PY'
          import pathlib
          import tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert project["project"]["name"] == "free-claude-code"
          assert project["project"]["requires-python"] == "==3.14.7"
          scripts = project["project"]["scripts"]
          for name in ("fcc-server", "fcc-codex", "fcc-doctor"):
              assert name in scripts, name
          assert pathlib.Path("uv.lock").is_file()
          print("Pinned FCC source identity and manifest checks passed")
          PY
      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.13"
          enable-cache: false
      - name: Install exact Python and locked FCC dependencies
        working-directory: upstream-fcc
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.14.7
          uv sync --locked --no-dev --no-default-groups
      - name: Verify FCC installed commands (no keys, no model requests)
        working-directory: upstream-fcc
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync fcc-server --version
          uv run --no-sync fcc-doctor --version
          uv run --no-sync python - <<'PY'
          from importlib.metadata import distribution
          package = distribution("free-claude-code")
          entries = {item.name for item in package.entry_points}
          assert {"fcc-server", "fcc-codex", "fcc-doctor"} <= entries
          print("FCC entrypoint verification passed (provider not configured)")
          PY

      - name: Start FCC on loopback and check HTTP health (no provider key)
        working-directory: upstream-fcc
        shell: bash
        env:
          HOST: "127.0.0.1"
          PORT: "18082"
          FCC_OPEN_BROWSER: "false"
        run: |
          set -euo pipefail
          uv run --no-sync fcc-server > "$RUNNER_TEMP/fcc-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18082/health > "$RUNNER_TEMP/health.json" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "FCC server did not pass loopback health check" >&2
            tail -n 45 "$RUNNER_TEMP/fcc-server.log" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib
          payload = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "health.json").read_text())
          assert payload == {"status": "healthy"}, payload
          print("FCC loopback health endpoint passed, no inference request sent")
          PY
