name: NVIDIA NIM one-shot model test

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Exact NVIDIA model ID (leave default unless confirmed)'
        required: true
        type: string
        default: 'nvidia/nemotron-3-super-120b-a12b'

permissions:
  contents: read

jobs:
  model-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout only this lab repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check one NVIDIA model response
        shell: bash
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_MODEL: ${{ inputs.model }}
        run: python3 scripts/nvidia_probe.py
